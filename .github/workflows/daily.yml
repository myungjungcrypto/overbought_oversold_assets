# 하루 3회 리포트 (KST 기준): 07:30 미국장 마감 후 · 12:00 한국 오전장 · 18:30 아시아 마감 후.
# 같은 날짜 실행은 리포트·히스토리를 덮어쓰므로 Δ전일은 항상 "어제 마지막 기록 대비"다.
# 리포트 커밋은 [skip ci]로 CI 재트리거를 막고, concurrency로 중복 실행을 막는다.
name: Daily Report
on:
  schedule:
    - cron: "30 22 * * *"   # 07:30 KST — 미국장 마감 반영
    - cron: "0 3 * * *"     # 12:00 KST — 한국 오전장·밤사이 크립토
    - cron: "30 9 * * *"    # 18:30 KST — 한국·일본·홍콩 마감 반영
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-report
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run scan (live)
        run: python -m oo_scan run
      - name: Run backtest (uses cached data)
        run: python -m oo_scan backtest --offline
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports docs
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "daily report: $(date -u +%F) [skip ci]"
            # 리포트는 생성 산출물 — 동시 실행과 충돌하면 새로 만든 쪽(-X theirs)이 이긴다
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
