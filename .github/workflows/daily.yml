# 매일 아침 리포트 — 07:30 KST (22:30 UTC 전일). 수동 실행은 workflow_dispatch.
# 리포트 커밋은 [skip ci]로 CI 재트리거를 막고, concurrency로 중복 실행을 막는다.
name: Daily Report
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-report
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run scan (live)
        run: python -m oo_scan run
      - name: Run backtest (uses cached data)
        run: python -m oo_scan backtest --offline
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports docs
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "daily report: $(date -u +%F) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
