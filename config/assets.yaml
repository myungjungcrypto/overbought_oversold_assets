# 자산 유니버스 — 광기-소외 온도계 대상 28종
# 항목 추가/제거는 이 파일 수정만으로 반영된다. (★=추천 추가분, ✚=신흥국 ETF 기본 세트)
assets:
  # ── 크립토 (ccxt) ─────────────────────────────
  - id: BTC
    name_ko: 비트코인
    asset_class: crypto
    source: ccxt
    symbol: BTC/USDT
    exchanges: [binance, bybit, gateio, okx]
  - id: ETH
    name_ko: 이더리움
    asset_class: crypto
    source: ccxt
    symbol: ETH/USDT
    exchanges: [binance, bybit, gateio, okx]
  - id: SOL
    name_ko: 솔라나
    asset_class: crypto
    source: ccxt
    symbol: SOL/USDT
    exchanges: [binance, bybit, gateio, okx]
  - id: BNB
    name_ko: 비앤비
    asset_class: crypto
    source: ccxt
    symbol: BNB/USDT
    exchanges: [binance, bybit, gateio]
  - id: HYPE
    name_ko: 하이퍼리퀴드
    asset_class: crypto
    source: ccxt
    symbol: HYPE/USDT
    exchanges: [hyperliquid, bybit, gateio]
    symbol_overrides:
      hyperliquid: HYPE/USDC
  # ── 주요 지수 (yfinance) ──────────────────────
  - id: SPX
    name_ko: S&P500
    asset_class: index
    source: yfinance
    symbol: "^GSPC"
  - id: NASDAQ
    name_ko: 나스닥 종합
    asset_class: index
    source: yfinance
    symbol: "^IXIC"
  - id: KOSPI
    name_ko: 코스피
    asset_class: index
    source: yfinance
    symbol: "^KS11"
  - id: KOSDAQ
    name_ko: 코스닥
    asset_class: index
    source: yfinance
    symbol: "^KQ11"
  - id: NIKKEI
    name_ko: 닛케이225
    asset_class: index
    source: yfinance
    symbol: "^N225"
  - id: HSI            # ★
    name_ko: 항셍
    asset_class: index
    source: yfinance
    symbol: "^HSI"
  - id: SOX            # ★
    name_ko: 필라델피아 반도체
    asset_class: index
    source: yfinance
    symbol: "^SOX"
  # ── 신흥국 지수 ETF (yfinance) ─────────────────
  - id: EEM            # ✚
    name_ko: 신흥국 전체 (MSCI EM)
    asset_class: em_index
    source: yfinance
    symbol: EEM
  - id: MCHI           # ✚
    name_ko: 중국 (MSCI China)
    asset_class: em_index
    source: yfinance
    symbol: MCHI
  - id: INDA           # ✚
    name_ko: 인도 (MSCI India)
    asset_class: em_index
    source: yfinance
    symbol: INDA
  - id: EWZ            # ✚
    name_ko: 브라질 (MSCI Brazil)
    asset_class: em_index
    source: yfinance
    symbol: EWZ
  - id: VNM            # ✚
    name_ko: 베트남 (VanEck Vietnam)
    asset_class: em_index
    source: yfinance
    symbol: VNM
  - id: EWT            # ✚
    name_ko: 대만 (MSCI Taiwan)
    asset_class: em_index
    source: yfinance
    symbol: EWT
  # ── 금리 (yfinance) ───────────────────────────
  - id: US10Y
    name_ko: 미국 10년물 금리
    asset_class: rate
    source: yfinance
    symbol: "^TNX"
    display_scale: 0.1
    display_unit: "%"
  - id: US30Y          # ★
    name_ko: 미국 30년물 금리
    asset_class: rate
    source: yfinance
    symbol: "^TYX"
    display_scale: 0.1
    display_unit: "%"
  # ── 원자재 (yfinance) ─────────────────────────
  - id: GOLD
    name_ko: 금
    asset_class: commodity
    source: yfinance
    symbol: "GC=F"
  - id: SILVER
    name_ko: 은
    asset_class: commodity
    source: yfinance
    symbol: "SI=F"
  - id: COPPER
    name_ko: 구리
    asset_class: commodity
    source: yfinance
    symbol: "HG=F"
  - id: WTI            # ★
    name_ko: WTI 원유
    asset_class: commodity
    source: yfinance
    symbol: "CL=F"
  # ── 환율 (yfinance) ───────────────────────────
  - id: DXY
    name_ko: 달러인덱스
    asset_class: fx
    source: yfinance
    symbol: "DX-Y.NYB"
  - id: USDJPY
    name_ko: 달러/엔
    asset_class: fx
    source: yfinance
    symbol: "JPY=X"
  - id: USDKRW         # ★
    name_ko: 달러/원
    asset_class: fx
    source: yfinance
    symbol: "KRW=X"
  # ── 변동성 (yfinance) ─────────────────────────
  - id: VIX            # ★
    name_ko: VIX 변동성지수
    asset_class: vol
    source: yfinance
    symbol: "^VIX"
